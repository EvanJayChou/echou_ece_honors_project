# Shared params for vesc_driver_node and ackermann_to_vesc_node
/**:
  ros__parameters:
    port: /dev/ttyACM1

    # speed (m/s) -> erpm: erpm = gain * speed + offset
    speed_to_erpm_gain: 4921.82
    speed_to_erpm_offset: 0.0

    # steering angle (rad) -> servo [0,1]: servo = gain * angle + offset
    steering_angle_to_servo_gain: -0.6
    steering_angle_to_servo_offset: 0.5

    # driver limits
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.05
    servo_max: 0.95
